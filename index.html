<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icons/favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <!-- Match installed-PWA system chrome to the opaque counterpart of the
         compact bottom tab bar. Android may apply this to surrounding UI
         such as the status/navigation area; the OS remains final authority. -->
    <meta name="theme-color" content="#d4ded1" />
    <!-- The app is light-only by design. Declaring that tells browsers to
         render UA-owned surfaces (form controls and, on Android, the native
         date/time picker dialogs) in their light theme so they sit closer to
         the app instead of appearing as dark OS panels. This is the only
         standards-based influence a page has over those dialogs. -->
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="An offline hiking companion for the Kungsleden, bringing route, stage, hut and packing information together alongside your navigation tools."
    />
    <title>Fjällkompis — Kungsleden hiking companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
