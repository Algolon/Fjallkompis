name: Release Fjallkompis

# ONE committed `main` SHA -> a verified, reproducible signed AAB -> Google Play
# Internal Testing -> a ledger pull request recording what was consumed.
#
# Production rollout is NOT part of this workflow and is not one input away from
# it: the track is a constant in scripts/release-candidate.mjs, and
# scripts/play-release.mjs refuses every other track by name.
#
# THE SHAPE, and why it is four jobs rather than one:
#
#   preflight  cheap, fast-failing. Proves the dispatch is `main`, pins the
#              exact SHA, derives the candidate versionCode from committed
#              metadata, and asks PLAY ITSELF which codes it already holds.
#              Holds `id-token: write` (for Google) and no signing secrets.
#
#   build      the long one. Every existing release gate, unchanged, plus the
#              signed bundle. Holds the four signing secrets and `contents:
#              read`. It has no Google credential and cannot publish anything.
#
#   publish    downloads the artifact and inspects it INDEPENDENTLY — in a job
#              that never saw the keystore — re-deriving the expected identity
#              from committed metadata rather than trusting the build job's
#              word for it. Then, and only then, uploads to Play.
#
#   ledger     after Play accepts, opens a pull request recording the consumed
#              code. The only job with write permission, restricted to three
#              release-metadata files and enforced by a path allowlist before
#              the push. It cannot reach `main`: branch protection requires a
#              pull request, and this workflow is not a bypass actor.
#
# A versionCode Play accepts can never be reused or reclaimed. Every ambiguous
# outcome below therefore fails closed and says so, rather than assuming a code
# is still free.

on:
  # Manual dispatch ONLY, and only from `main` — enforced below rather than
  # assumed, because workflow_dispatch lets the caller choose a ref. (During
  # this workflow's own pull request a temporary branch-scoped push trigger
  # existed here, because GitHub only dispatches workflows that already exist on
  # the default branch; it was removed once the signed bundle was proven in run
  # 31229585172. Do not reintroduce it.)
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What testers should read in Play (optional, <=500 chars)"
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build and verify everything, then STOP before the Play upload'
        required: false
        type: boolean
        default: false

# Least privilege at the top; only the ledger job widens it, and only to what it
# needs to open a pull request.
permissions:
  contents: read

concurrency:
  # A CONSTANT group, deliberately not scoped by ref or run: releasing twice at
  # once is the way to consume a versionCode by accident. cancel-in-progress is
  # false because cancelling a release mid-upload is worse than queueing.
  group: fjallkompis-release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  preflight:
    name: Pin main, derive the candidate, ask Play
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # ONLY for the Google STS exchange. No other job has it.
    outputs:
      source_sha: ${{ steps.pin.outputs.source_sha }}
      application_id: ${{ steps.candidate.outputs.applicationId }}
      version_name: ${{ steps.candidate.outputs.versionName }}
      version_code: ${{ steps.candidate.outputs.versionCode }}
      android_build: ${{ steps.candidate.outputs.androidBuild }}
      track: ${{ steps.candidate.outputs.track }}
    steps:
      - name: Refuse anything that is not main
        # workflow_dispatch accepts any ref. A release built from a feature
        # branch would carry a versionCode derived from uncommitted-to-main
        # metadata and consume it forever.
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" != "main" ]; then
            echo "::error::this workflow releases committed main only — dispatched from $REF_TYPE '$REF_NAME'"
            exit 1
          fi
          echo "Dispatched from branch main."

      - name: Pin the exact main SHA
        id: pin
        # github.sha is what GitHub resolved at dispatch. It is compared against
        # the live tip so a release cannot silently be of a commit that is
        # already stale, and every later job checks out this SHA by name rather
        # than re-resolving `main`.
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ github.sha }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$tip" != "$PINNED" ]; then
            echo "::error::main advanced between dispatch and start (dispatched $PINNED, tip is $tip). Re-run the workflow."
            exit 1
          fi
          echo "source_sha=$PINNED" >> "$GITHUB_OUTPUT"
          echo "Releasing main @ $PINNED"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.source_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Derive the release candidate from committed metadata
        id: candidate
        # Derived — never chosen, never incremented here. The script reads
        # package.json + android/version.properties + android/release-ledger.json
        # with the same formula android/app/build.gradle uses, and refuses a
        # candidate that is at or below the consumed fence, or already in the
        # append-only list.
        run: node scripts/release-candidate.mjs --github-output

      - name: Ask Play which versionCodes it already holds
        # The committed ledger is written AFTER a release, so it can be stale —
        # a lost upload response is exactly the case that leaves it so. Play is
        # the authority on what is consumed, and it is asked before a runner is
        # spent on a build.
        #
        # Skipped only when a dry run is requested on a repository that has not
        # finished the Google setup; a real release cannot skip it.
        if: ${{ !inputs.dry_run || (vars.PLAY_WORKLOAD_IDENTITY_PROVIDER != '' && vars.PLAY_SERVICE_ACCOUNT != '') }}
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: node scripts/play-release.mjs probe

      - name: Note that this is a dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::DRY RUN — the bundle will be built and verified, and nothing will be uploaded."

  # ---------------------------------------------------------------------------
  build:
    name: Build and verify the signed AAB
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read # No id-token here: this job must not be able to reach Google.
    outputs:
      aab_name: ${{ steps.bundle.outputs.name }}
      aab_sha256: ${{ steps.bundle.outputs.sha256 }}
      signer_sha256: ${{ steps.verify.outputs.signer_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@v4
        with:
          # Same Node major as pr-ci.yml, deploy.yml and android-spike.yml.
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Fail early if signing secrets are missing
        # Checked BEFORE the long build so a misconfigured repository costs
        # seconds, not minutes. Only emptiness is ever tested — no secret value
        # is printed, compared in the open, or written to a file here.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${KEYSTORE_B64:-}" ]     && missing="$missing ANDROID_UPLOAD_KEYSTORE_BASE64"
          [ -z "${KEYSTORE_PASSWORD:-}" ] && missing="$missing ANDROID_UPLOAD_KEYSTORE_PASSWORD"
          [ -z "${KEY_ALIAS:-}" ]         && missing="$missing ANDROID_UPLOAD_KEY_ALIAS"
          [ -z "${KEY_PASSWORD:-}" ]      && missing="$missing ANDROID_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see docs/ANDROID.md, 'Release signing'."
            exit 1
          fi
          echo "All four upload-signing secrets are present."

      - run: npm ci

      # ---- Regression gates: the shared application must still be sound -----
      #
      # Identical to the debug APK workflow and to pr-ci.yml, and run BEFORE
      # anything Android-specific. A release build is the last place to
      # discover the web app is broken.
      - name: Test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Web build (GitHub Pages target — regression gate only, never deployed)
        run: npm run build

      # ---- The native target ------------------------------------------------
      - name: Native build
        run: npm run build:native

      - name: Verify the native web bundle
        run: npm run verify:native

      # Play is given ONE public privacy-policy URL, and the Data safety form
      # cannot be completed without it. deploy.yml, pr-ci.yml and
      # android-spike.yml all run this verifier; the RELEASE workflow — the one
      # whose artifact actually reaches Play — was the only one that did not.
      # The 2700005 candidate was checked by hand after the fact instead, which
      # is not a gate. Same canonical verifier, same invocation as everywhere
      # else, so a bundle can never be built without the policy again.
      - name: Verify the privacy policy in the release bundle
        run: node scripts/verify-privacy-build.mjs

      # The map catalog is the single source of archive identity for the app
      # runtime, the service worker, the Android adapter and the tests. A
      # release whose catalog disagrees with the bundled basemap ships a Map tab
      # that cannot resolve its own data.
      - name: Verify the map catalog and the bundled archive revision
        run: node --test tests/map-parity.test.mjs tests/coverage-contract.test.mjs

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure the compile SDK and build tools are installed
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # ---- Signing material, briefly ----------------------------------------
      - name: Reconstruct the upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # RUNNER_TEMP is outside the workspace, so the keystore cannot be
          # picked up by actions/upload-artifact or by a stray `git add`.
          # umask 077 keeps it readable only by the build user.
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          # Size only — never the contents, never a fingerprint that could be
          # correlated before the artifact exists.
          echo "Keystore reconstructed ($(stat -c%s "$RUNNER_TEMP/upload-keystore.jks") bytes)."

      - name: Check the keystore and credentials before building
        # Gradle's signing failure is a single confusing line — "keystore
        # password was incorrect" — that fires identically for a corrupt
        # keystore, a wrong store password, a missing alias and a wrong key
        # password. This step separates those four cases BEFORE spending a
        # full build on them, and says which secret to fix.
        #
        # Nothing secret is printed. keytool never echoes a password, its
        # output is captured rather than streamed, and only a classified
        # verdict is emitted — the alias would be masked by Actions anyway.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          ks="$RUNNER_TEMP/upload-keystore.jks"

          # 0. Is the decoded file even a keystore? A base64 that lost bytes
          #    fails here rather than masquerading as a password problem.
          size=$(stat -c%s "$ks")
          magic=$(head -c 4 "$ks" | od -An -tx1 | tr -d ' \n')
          case "$magic" in
            feedfeed) kind="JKS" ;;
            3082*|3081*) kind="PKCS12" ;;
            *) kind="UNRECOGNISED" ;;
          esac
          # WHICH keystore is this? A file digest identifies the container
          # without revealing anything inside it — it is a hash of encrypted
          # bytes, not a credential. This exists because "the password does
          # not open it" has two very different causes, and they are
          # indistinguishable from the error alone: a wrong password, or a
          # keystore that is simply not the file whose password you know
          # (typically because the keystore was regenerated after the base64
          # secret was set). Comparing this digest against the local file
          # settles it in one step.
          digest=$(sha256sum "$ks" | cut -d' ' -f1)
          echo "Decoded keystore: ${size} bytes, container looks like ${kind}."
          echo "Keystore SHA-256: ${digest}"
          echo "Compare locally with:  shasum -a 256 fjallkompis-upload.jks"
          echo "If those differ, ANDROID_UPLOAD_KEYSTORE_BASE64 holds a DIFFERENT keystore than the one you have — re-encode and update that secret."
          if [ "$kind" = "UNRECOGNISED" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 did not decode to a keystore. Re-run: base64 -i fjallkompis-upload.jks | pbcopy, and paste the WHOLE value."
            exit 1
          fi

          # 1. Store password.
          if ! out=$(keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" 2>&1); then
            if echo "$out" | grep -qi "password was incorrect\|Keystore was tampered"; then
              echo "::error::ANDROID_UPLOAD_KEYSTORE_PASSWORD does not open this keystore. Check for a trailing newline or space in the secret value."
            else
              echo "::error::the keystore could not be read (not a password problem):"
              echo "$out" | tail -5
            fi
            exit 1
          fi
          echo "Store password OK."

          # 2. Alias present.
          if ! keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::ANDROID_UPLOAD_KEY_ALIAS is not an alias in this keystore. It must match the -alias used with keytool -genkeypair (docs/ANDROID.md suggests fjallkompis-upload)."
            exit 1
          fi
          echo "Alias found."

          # 3. Key password — proven by an operation that needs the private
          #    key. The CSR is discarded; only success or failure matters.
          if ! keytool -certreq -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" \
                 -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_UPLOAD_KEY_PASSWORD does not unlock the key. If keytool only asked once, the key password equals the STORE password — set both secrets to the same value."
            exit 1
          fi
          echo "Key password OK. All four signing secrets are consistent."

      - name: Record the release identity
        id: identity
        working-directory: android
        env:
          ANDROID_UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -q :app:printReleaseIdentity | tee identity.txt
          while IFS='=' read -r key value; do
            case "$key" in
              applicationId|versionName|versionCode) echo "$key=$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < identity.txt
          rm -f identity.txt

      - name: Gradle must agree with the derived candidate
        # Two independent derivations of the same number — the Groovy formula in
        # build.gradle and the JavaScript one in scripts/release-candidate.mjs.
        # If they ever disagree, the artifact and the ledger would describe
        # different releases, and the ledger is what fences the next one.
        env:
          GRADLE_ID: ${{ steps.identity.outputs.applicationId }}
          GRADLE_NAME: ${{ steps.identity.outputs.versionName }}
          GRADLE_CODE: ${{ steps.identity.outputs.versionCode }}
          EXPECTED_ID: ${{ needs.preflight.outputs.application_id }}
          EXPECTED_NAME: ${{ needs.preflight.outputs.version_name }}
          EXPECTED_CODE: ${{ needs.preflight.outputs.version_code }}
        run: |
          set -euo pipefail
          [ "$GRADLE_ID" = "$EXPECTED_ID" ] || { echo "::error::Gradle applicationId '$GRADLE_ID' != derived '$EXPECTED_ID'"; exit 1; }
          [ "$GRADLE_NAME" = "$EXPECTED_NAME" ] || { echo "::error::Gradle versionName '$GRADLE_NAME' != derived '$EXPECTED_NAME'"; exit 1; }
          [ "$GRADLE_CODE" = "$EXPECTED_CODE" ] || { echo "::error::Gradle versionCode '$GRADLE_CODE' != derived '$EXPECTED_CODE'"; exit 1; }
          echo "Gradle and the release-candidate script agree: $EXPECTED_ID $EXPECTED_NAME ($EXPECTED_CODE)."

      - name: Gradle host-side unit tests
        # The map downloader's URL policy (MapArchiveUrlPolicyTest) gates the
        # release too, not only the spike APK: it is the boundary between
        # JavaScript-supplied URLs and native HTTP, and a release is the last
        # place to discover it stopped holding.
        #
        # The DEBUG variant deliberately: the policy is plain Java with no
        # build-config input, so both variants compile identical source, and
        # the debug task cannot interact with the release signing guard.
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Gradle bundleRelease
        working-directory: android
        env:
          ANDROID_UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      # ---- "Gradle succeeded" is not "ready for Play" ------------------------
      - name: Fetch bundletool (pinned, checksum-verified)
        # The AAB's AndroidManifest.xml is PROTOBUF, not text: scraping it
        # with `strings` is a heuristic that failed in run 31229129455 even
        # though the id was present. bundletool is Google's own App Bundle
        # tool and decodes the manifest properly. It is not preinstalled on
        # the ubuntu-24.04 runner image (checked against the published image
        # manifest), so it is fetched from google/bundletool's official
        # release — version-pinned, and verified against a SHA-256 computed
        # independently from the same release before this step was written.
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/bundletool.jar"
          curl -sSfL --retry 3 \
            -o "$jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $jar" | sha256sum -c - \
            || { echo "::error::bundletool download failed its checksum — refusing to run an unverified tool"; exit 1; }
          java -jar "$jar" version

      - name: Verify the bundle is release-signed with the upload key
        id: verify
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          EXPECTED_APPLICATION_ID: ${{ steps.identity.outputs.applicationId }}
          EXPECTED_VERSION_NAME: ${{ steps.identity.outputs.versionName }}
          EXPECTED_VERSION_CODE: ${{ steps.identity.outputs.versionCode }}
        run: |
          set -euo pipefail
          aab=android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$aab" ] || { echo "::error::no release bundle at $aab"; exit 1; }

          # 1. The bundle carries a valid signature at all.
          #
          # The warnings jarsigner prints alongside "jar verified" — a
          # self-signed certificate, an unbuildable PKIX path, no timestamp —
          # are EXPECTED for an upload key and are not failures. Play requires
          # exactly this shape: a self-signed key it then replaces with the
          # Play App Signing key.
          verify="$(jarsigner -verify "$aab")"
          echo "$verify"
          # Herestring, NOT `echo | grep -q`: under pipefail, grep -q exiting
          # at the first match (the verdict is the FIRST line, the ~500-line
          # warnings blob follows) can kill echo with EPIPE and fail the
          # pipeline on a perfectly signed bundle. Run 31249233733 lost that
          # race; run 31229585172 had won it by timing luck.
          grep -q "jar verified" <<<"$verify" || { echo "::error::bundle is not signed"; exit 1; }

          # The signer certificate, read with the tool that actually prints
          # one. An earlier revision scraped `jarsigner -verify -verbose
          # -certs` for a line containing "Signer certificate" — jarsigner
          # emits no such line, so the grep matched nothing, exited 1, and
          # under `set -o pipefail` killed the whole step before any error
          # message could explain why. Hence both the switch to
          # `keytool -printcert -jarfile` and the explicit emptiness checks
          # below: a verification step that dies silently teaches nobody
          # anything.
          if ! signer_cert="$(keytool -printcert -jarfile "$aab" 2>&1)"; then
            echo "::error::could not read the signer certificate from the bundle:"
            echo "$signer_cert" | tail -5
            exit 1
          fi

          # 2. It is signed by OUR upload key, not something else. Certificate
          #    fingerprints are public information (Play displays them), so
          #    computing and comparing them here is safe; only the passwords
          #    stay hidden.
          signer_sha="$(echo "$signer_cert" | grep -m1 'SHA256:' | tr -d ' ' | cut -d: -f2-)"
          if [ -z "$signer_sha" ]; then
            echo "::error::no SHA256 fingerprint found in the bundle's signer certificate — cannot prove which key signed it"
            echo "$signer_cert" | head -20
            exit 1
          fi
          key_sha="$(keytool -list -v \
              -keystore "$RUNNER_TEMP/upload-keystore.jks" \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -m1 'SHA256:' | tr -d ' ' | cut -d: -f2-)"
          if [ -z "$key_sha" ]; then
            echo "::error::no SHA256 fingerprint found for the upload key in the keystore — cannot compare"
            exit 1
          fi
          if [ "$signer_sha" != "$key_sha" ]; then
            echo "::error::bundle signer does not match the configured upload key"
            echo "  bundle signer: $signer_sha"
            echo "  upload key   : $key_sha"
            exit 1
          fi
          echo "Signer certificate matches the upload key (SHA-256 $signer_sha)."

          #    …and against the COMMITTED fingerprint, which is the check that
          #    actually matters. The comparison above is against a key derived
          #    from the same secrets in the same run: if someone replaced the
          #    ANDROID_UPLOAD_* secrets with a keystore they control, it would
          #    pass, because "the configured upload key" would be theirs. Only a
          #    value the secrets cannot reach can detect that, and the only such
          #    value here is one that lives in the repository and moves through
          #    a reviewed pull request. MANDATORY — there is no skip path.
          want="$(node -e '
            import("./scripts/release-candidate.mjs").then(m =>
              process.stdout.write(m.normaliseFingerprint(m.UPLOAD_KEY_SHA256)))')"
          got="$(echo "$signer_sha" | tr -d ' :' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$want" ]; then
            echo "::error::UPLOAD_KEY_SHA256 could not be read from scripts/release-candidate.mjs — refusing to release without the signing trust anchor"
            exit 1
          fi
          if [ "$want" != "$got" ]; then
            echo "::error::the bundle signer does NOT match the upload key Play has registered."
            echo "  committed anchor: $want"
            echo "  bundle signer   : $got"
            echo "If the upload key was legitimately rotated, change UPLOAD_KEY_SHA256 in"
            echo "scripts/release-candidate.mjs in a reviewed pull request. If it was not,"
            echo "the ANDROID_UPLOAD_* secrets have been replaced — stop and investigate."
            exit 1
          fi
          echo "Signer matches the committed upload-key anchor."
          echo "signer_sha256=$signer_sha" >> "$GITHUB_OUTPUT"

          # 3. It is emphatically NOT the Android debug key — read from the
          #    same certificate output, so this cannot pass by looking at
          #    nothing.
          if echo "$signer_cert" | grep -q "CN=Android Debug"; then
            echo "::error::bundle is DEBUG-signed — Play would reject it"
            exit 1
          fi
          echo "Signer is not the Android debug key."

          # 4. The PACKAGED manifest resolves to the permanent identity —
          #    read protobuf-aware with bundletool, never with a printable-
          #    string heuristic (a previous `strings | grep -x` failed here
          #    with the id present, because a proto manifest is not lines).
          #    Checked against the packaged bundle, not the build config, so
          #    what Play would ingest is what is being verified.
          dump() {
            java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$aab" "$@"
          }
          if ! pkg="$(dump --xpath=/manifest/@package)"; then
            echo "::error::bundletool could not read the bundled manifest — the AAB may be malformed. Full dump attempt:"
            dump | head -20 || true
            exit 1
          fi
          pkg="$(echo "$pkg" | tr -d '[:space:]')"
          if [ "$pkg" != "$EXPECTED_APPLICATION_ID" ]; then
            echo "::error::bundled manifest package is '$pkg', expected '$EXPECTED_APPLICATION_ID'"
            exit 1
          fi
          echo "Bundled manifest package: $pkg"

          #    And the packaged version identity matches what Gradle computed,
          #    so the artifact cannot silently disagree with the job summary.
          vname="$(dump --xpath=/manifest/@android:versionName | tr -d '[:space:]')"
          vcode="$(dump --xpath=/manifest/@android:versionCode | tr -d '[:space:]')"
          if [ -z "$vname" ] || [ -z "$vcode" ]; then
            echo "::error::could not read versionName/versionCode from the packaged manifest"
            dump | head -5 || true
            exit 1
          fi
          if [ "$vname" != "$EXPECTED_VERSION_NAME" ] || [ "$vcode" != "$EXPECTED_VERSION_CODE" ]; then
            echo "::error::packaged version identity (name=$vname code=$vcode) does not match the computed identity (name=$EXPECTED_VERSION_NAME code=$EXPECTED_VERSION_CODE)"
            exit 1
          fi
          echo "Packaged version identity: versionName=$vname versionCode=$vcode"

          # 5. It is not debuggable. A release AAB with android:debuggable="true"
          #    re-enables remote WebView inspection on every install; the gradle
          #    default keeps it off, and this proves the default held.
          dbg="$(dump --xpath=/manifest/application/@android:debuggable 2>/dev/null | tr -d '[:space:]' || true)"
          if [ "$dbg" = "true" ]; then
            echo "::error::the packaged application is DEBUGGABLE — refusing to release it"
            exit 1
          fi
          echo "Packaged application is not debuggable."

          # 6. No signing material rode along inside the bundle. The signature
          #    itself lives in META-INF and is expected; a keystore is not.
          if unzip -l "$aab" | grep -Eq '\.(jks|keystore|p12)$'; then
            echo "::error::a keystore is present INSIDE the bundle"
            exit 1
          fi
          echo "No keystore material inside the bundle."

      - name: Verify the packaged Fjallkompis branding
        # tests/branding-parity.test.mjs proves the SOURCE tree derives every
        # icon from assets/brand/fjallkompis-mark-512.png. This proves the
        # bundle Play ingests actually carries them: AAPT2 sits in between,
        # renaming resources into density-qualified directories, re-encoding
        # PNGs and dropping anything that stopped resolving. A wrong launcher
        # icon is invisible in CI logs and obvious on a home screen, which is
        # the worst possible order to find out.
        #
        # Compares decoded PIXELS, not bytes — AAPT2's PNG crunching is
        # lossless, so the pixels must match exactly while the bytes will not.
        run: node scripts/verify-packaged-branding.mjs android/app/build/outputs/bundle/release/app-release.aab

      - name: Verify the packaged vector basemap
        # verify:native proves the archive is in dist/; this proves it is in
        # the bundle Play actually ingests, byte-identical to the committed
        # file. The Map tab reads the PACKAGED copy as one complete blob in
        # the native shell (src/map/bundledArchive.mjs), so a bundle without
        # it — or with a stale or truncated copy — ships a Map tab with no
        # offline basemap, silently, on every fresh install.
        run: |
          set -euo pipefail
          aab=android/app/build/outputs/bundle/release/app-release.aab
          entry=base/assets/public/maps/kungsleden.pmtiles
          if ! unzip -l "$aab" "$entry" > /dev/null; then
            echo "::error::$entry is missing from the bundle — the Map tab would have no offline basemap"
            exit 1
          fi
          packaged_sha="$(unzip -p "$aab" "$entry" | sha256sum | cut -d' ' -f1)"
          source_sha="$(sha256sum public/maps/kungsleden.pmtiles | cut -d' ' -f1)"
          if [ "$packaged_sha" != "$source_sha" ]; then
            echo "::error::packaged basemap ($packaged_sha) differs from public/maps/kungsleden.pmtiles ($source_sha)"
            exit 1
          fi
          echo "Packaged vector basemap verified (sha256 $packaged_sha)."

      - name: Verify the optional map archives are NOT in the bundle
        # The mirror image of the check above, and the one that has never
        # existed. Terrain, contours and satellite are user-initiated
        # downloads on both platforms (src/map/nativeArchiveStore.ts); they
        # sit in public/maps/ on any machine that has run the deploy fetch,
        # and Vite copies public/ wholesale. Without this, one such machine
        # ships a ~90 MB heavier bundle and nobody finds out until Play shows
        # the size.
        run: |
          set -euo pipefail
          aab=android/app/build/outputs/bundle/release/app-release.aab
          for f in kungsleden-terrain.pmtiles kungsleden-contours.pmtiles kungsleden-satellite.pmtiles kungsleden-satellite-hd-north.pmtiles kungsleden-satellite-hd-south.pmtiles; do
            if unzip -l "$aab" "base/assets/public/maps/$f" > /dev/null 2>&1; then
              echo "::error::$f is an optional download and must not be packaged in the AAB"
              exit 1
            fi
          done
          echo "Optional map archives correctly absent from the bundle."

      - name: Name the bundle and summarise
        id: bundle
        env:
          APPLICATION_ID: ${{ steps.identity.outputs.applicationId }}
          VERSION_NAME: ${{ steps.identity.outputs.versionName }}
          VERSION_CODE: ${{ steps.identity.outputs.versionCode }}
          SIGNER: ${{ steps.verify.outputs.signer_sha256 }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          out="fjallkompis-${VERSION_NAME}-${VERSION_CODE}-internal-release.aab"
          mkdir -p artifact
          cp android/app/build/outputs/bundle/release/app-release.aab "artifact/${out}"
          size="$(du -h "artifact/${out}" | cut -f1)"
          bytes="$(stat -c%s "artifact/${out}")"
          sha="$(sha256sum "artifact/${out}" | cut -d' ' -f1)"
          echo "name=${out}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "### Built and verified"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Source \`main\` | \`${SOURCE_SHA}\` |"
            echo "| File | \`${out}\` |"
            echo "| Size | ${size} (${bytes} bytes) |"
            echo "| AAB SHA-256 | \`${sha}\` |"
            echo "| Application id | \`${APPLICATION_ID}\` |"
            echo "| versionName | \`${VERSION_NAME}\` |"
            echo "| versionCode | \`${VERSION_CODE}\` |"
            echo "| Upload signer SHA-256 | \`${SIGNER}\` |"
            echo "| Dry run | ${DRY_RUN} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the AAB
        uses: actions/upload-artifact@v4
        with:
          name: fjallkompis-android-internal-release
          # Only the bundle. No mapping files, no intermediates, no keystore.
          path: artifact/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Destroy the temporary signing material
        # always(): the keystore must not survive a failed build either.
        if: always()
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/upload-keystore.jks"
          if [ -f "$target" ]; then
            shred -u "$target" 2>/dev/null || rm -f "$target"
          fi
          # Belt and braces: nothing keystore-shaped anywhere in the workspace.
          find "$GITHUB_WORKSPACE" -type f \
            \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' \) -delete 2>/dev/null || true
          echo "Signing material removed."

  # ---------------------------------------------------------------------------
  publish:
    name: Inspect the artifact independently, then release to Internal Testing
    needs: [preflight, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The Google STS exchange. Nothing else needs it.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/download-artifact@v4
        with:
          name: fjallkompis-android-internal-release
          path: artifact

      - name: Fetch bundletool (pinned, checksum-verified)
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/bundletool.jar"
          curl -sSfL --retry 3 \
            -o "$jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $jar" | sha256sum -c - \
            || { echo "::error::bundletool download failed its checksum — refusing to run an unverified tool"; exit 1; }

      - name: Inspect the artifact that will actually be uploaded
        id: inspect
        # INDEPENDENT of the build job on purpose. This job never held the
        # keystore, so it cannot re-derive the signer from the key; instead it
        # re-derives the expected IDENTITY from committed metadata and checks
        # the artifact against that, and pins the signer to the fingerprint the
        # build job recorded. An artifact swapped between jobs fails here.
        env:
          EXPECTED_ID: ${{ needs.preflight.outputs.application_id }}
          EXPECTED_NAME: ${{ needs.preflight.outputs.version_name }}
          EXPECTED_CODE: ${{ needs.preflight.outputs.version_code }}
          EXPECTED_NAME_FILE: ${{ needs.build.outputs.aab_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.aab_sha256 }}
          EXPECTED_SIGNER: ${{ needs.build.outputs.signer_sha256 }}
        run: |
          set -euo pipefail
          aab="artifact/${EXPECTED_NAME_FILE}"
          [ -f "$aab" ] || { echo "::error::the built artifact ${EXPECTED_NAME_FILE} is not in the download"; exit 1; }

          # Same bytes the build job verified — not a rebuild, not a re-sign.
          sha="$(sha256sum "$aab" | cut -d' ' -f1)"
          [ "$sha" = "$EXPECTED_SHA256" ] || {
            echo "::error::downloaded artifact sha256 $sha != the built $EXPECTED_SHA256"; exit 1; }

          # Re-derive the candidate here rather than trusting the passed value:
          # this is the second, independent reading of the committed metadata.
          derived_code="$(node -e '
            import("./scripts/release-candidate.mjs").then(m => {
              const c = m.releaseCandidate();
              if (!c.ok) { console.error(c.failures.join("\n")); process.exit(1); }
              process.stdout.write(String(c.versionCode));
            })')"
          [ "$derived_code" = "$EXPECTED_CODE" ] || {
            echo "::error::re-derived versionCode $derived_code != $EXPECTED_CODE"; exit 1; }

          dump() { java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$aab" "$@"; }
          pkg="$(dump --xpath=/manifest/@package | tr -d '[:space:]')"
          vname="$(dump --xpath=/manifest/@android:versionName | tr -d '[:space:]')"
          vcode="$(dump --xpath=/manifest/@android:versionCode | tr -d '[:space:]')"
          [ "$pkg" = "$EXPECTED_ID" ] || { echo "::error::packaged package '$pkg' != '$EXPECTED_ID'"; exit 1; }
          [ "$vname" = "$EXPECTED_NAME" ] || { echo "::error::packaged versionName '$vname' != '$EXPECTED_NAME'"; exit 1; }
          [ "$vcode" = "$derived_code" ] || { echo "::error::packaged versionCode '$vcode' != derived '$derived_code'"; exit 1; }

          dbg="$(dump --xpath=/manifest/application/@android:debuggable 2>/dev/null | tr -d '[:space:]' || true)"
          [ "$dbg" != "true" ] || { echo "::error::the artifact is debuggable"; exit 1; }

          signer="$(keytool -printcert -jarfile "$aab" | grep -m1 'SHA256:' | tr -d ' ' | cut -d: -f2-)"
          [ -n "$signer" ] || { echo "::error::the artifact carries no readable signer certificate"; exit 1; }
          [ "$signer" = "$EXPECTED_SIGNER" ] || {
            echo "::error::artifact signer $signer != the signer the build job verified $EXPECTED_SIGNER"; exit 1; }

          # And independently against the committed anchor, re-read here rather
          # than inherited from the build job — otherwise this job would be
          # trusting a value produced by the job it exists to check.
          anchor="$(node -e '
            import("./scripts/release-candidate.mjs").then(m =>
              process.stdout.write(m.normaliseFingerprint(m.UPLOAD_KEY_SHA256)))')"
          [ -n "$anchor" ] || { echo "::error::the committed upload-key anchor could not be read"; exit 1; }
          [ "$anchor" = "$(echo "$signer" | tr -d ' :' | tr '[:lower:]' '[:upper:]')" ] || {
            echo "::error::artifact signer does not match the committed upload-key anchor — refusing to upload"; exit 1; }
          keytool -printcert -jarfile "$aab" | grep -q "CN=Android Debug" && {
            echo "::error::the artifact is debug-signed"; exit 1; } || true

          unzip -l "$aab" | grep -Eq '\.(jks|keystore|p12)$' && {
            echo "::error::a keystore is present INSIDE the artifact"; exit 1; } || true

          unzip -l "$aab" base/assets/public/maps/kungsleden.pmtiles > /dev/null || {
            echo "::error::the artifact has no bundled vector basemap"; exit 1; }
          for f in kungsleden-terrain.pmtiles kungsleden-contours.pmtiles kungsleden-satellite.pmtiles kungsleden-satellite-hd-north.pmtiles kungsleden-satellite-hd-south.pmtiles; do
            if unzip -l "$aab" "base/assets/public/maps/$f" > /dev/null 2>&1; then
              echo "::error::optional archive $f is packaged in the artifact"; exit 1
            fi
          done

          echo "aab=$aab" >> "$GITHUB_OUTPUT"
          echo "Independent inspection passed: $pkg $vname ($vcode), sha256 $sha, signer $signer."

      - name: Release to Google Play Internal Testing
        id: release
        # The ONLY step in this repository that can consume a versionCode.
        # The track is not an input; scripts/play-release.mjs holds it as a
        # constant and refuses production, beta, alpha, open and closed by name.
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          # release_notes is caller-supplied free text. It reaches the shell as
          # an environment variable and never as a ${{ }} expansion inside a
          # run: block, because that expansion is textual substitution into the
          # script — the standard Actions injection.
          RELEASE_NOTES: ${{ inputs.release_notes }}
          AAB_PATH: ${{ steps.inspect.outputs.aab }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/play-release.mjs upload \
            --aab "$AAB_PATH" \
            --notes "$RELEASE_NOTES" \
            --source-sha "$SOURCE_SHA" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --provenance release-provenance.json

      - name: Record the provenance
        # Machine-generated, never hand-maintained prose. Answers "which exact
        # Fjallkompis source produced this Play build?" from the run itself.
        run: |
          set -euo pipefail
          {
            echo "### Released to Google Play — Internal Testing"
            echo
            echo '```json'
            cat release-provenance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: fjallkompis-release-provenance
          path: release-provenance.json
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  ledger:
    name: Open the release-ledger pull request
    needs: [preflight, build, publish]
    if: ${{ !inputs.dry_run && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # The ONLY write permissions in this workflow, and the narrowest pair that
      # can open a pull request. This job cannot reach `main`: the ruleset
      # requires a pull request there and does not list Actions as a bypass
      # actor. What it writes is re-checked against a path allowlist below.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        # Downloaded as a FILE rather than passed as a job output — the
        # provenance embeds caller-supplied release notes, and a job output is
        # substituted textually into whatever consumes it — and downloaded
        # OUTSIDE the working tree, so the allowlist check below can demand a
        # clean tree rather than carve out an exception for scratch files.
        with:
          name: fjallkompis-release-provenance
          path: ${{ runner.temp }}/provenance

      - name: Check the provenance is well-formed and describes this release
        env:
          EXPECTED_CODE: ${{ needs.preflight.outputs.version_code }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          node -e '
            const p = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/provenance/release-provenance.json", "utf8"));
            const fail = (m) => { console.error(`::error::${m}`); process.exit(1); };
            if (String(p.versionCode) !== process.env.EXPECTED_CODE) fail("provenance versionCode does not match this run");
            if (p.sourceSha !== process.env.EXPECTED_SHA) fail("provenance sourceSha does not match the pinned main SHA");
            if (p.track !== "internal") fail(`provenance track is ${p.track}`);
          '

      - name: Close the ledger
        run: node scripts/close-release-ledger.mjs --provenance "$RUNNER_TEMP/provenance/release-provenance.json"

      - name: Refuse anything outside the release-metadata allowlist
        # Runtime enforcement, not merely a test: whatever the script did, only
        # these three files may leave this job.
        #
        # `git status --porcelain`, NOT `git diff --name-only`: the latter shows
        # only tracked modifications, so a NEW file the script created would be
        # invisible here. Every scratch file this job needs is written to
        # RUNNER_TEMP for exactly this reason — the working tree must contain
        # nothing but the three allowed edits.
        run: |
          set -euo pipefail
          allowed="android/release-ledger.json android/version.properties docs/ANDROID.md"
          status="$(git status --porcelain)"
          echo "Working tree:"
          echo "$status"
          [ -n "$status" ] || { echo "::error::the ledger script changed nothing"; exit 1; }
          while read -r state file; do
            [ -n "${file:-}" ] || continue
            if [ "$state" != "M" ]; then
              echo "::error::unexpected working-tree state '$state' for $file — the ledger job may only MODIFY files"
              exit 1
            fi
            case " $allowed " in
              *" $file "*) ;;
              *) echo "::error::the ledger job touched $file, which is not release metadata"; exit 1 ;;
            esac
          done <<< "$status"
          echo "Only release metadata changed."

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
          VERSION_NAME: ${{ needs.preflight.outputs.version_name }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          branch="release/ledger-${VERSION_CODE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add android/release-ledger.json android/version.properties docs/ANDROID.md
          {
            printf 'chore(release): consume %s on Internal Testing\n\n' "$VERSION_CODE"
            printf 'Play accepted versionCode %s (%s) from main %s in run %s.\n' \
              "$VERSION_CODE" "$VERSION_NAME" "$SOURCE_SHA" "$GITHUB_RUN_ID"
            printf 'Records it in the append-only ledger, raises the consumed fence and\n'
            printf 'advances androidBuild by one.\n\nNo product or runtime change.\n'
          } > "$RUNNER_TEMP/commit-message.txt"
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git push origin "$branch"

          # Body built in a file, never as a --body argument: it embeds the
          # provenance, which embeds caller-supplied release notes.
          {
            printf 'Play accepted `%s` (`%s`) on the `internal` track.\n\n' "$VERSION_CODE" "$VERSION_NAME"
            printf '| | |\n|---|---|\n'
            printf '| Source `main` | `%s` |\n' "$SOURCE_SHA"
            printf '| Workflow run | %s/%s/actions/runs/%s |\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '| Track | `internal` |\n\n'
            printf 'Release metadata only — no product or runtime change. Until this merges the\n'
            printf 'committed ledger still says `%s` is free; the release workflow refuses a\n' "$VERSION_CODE"
            printf 're-release anyway, because its probe reads the consumed codes from Play.\n\n'
            printf '<details><summary>Provenance</summary>\n\n```json\n'
            cat "$RUNNER_TEMP/provenance/release-provenance.json"
            printf '\n```\n\n</details>\n'
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(release): consume ${VERSION_CODE} on Internal Testing" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Say what to do if this job failed
        if: failure()
        run: |
          {
            echo "### The ledger pull request could not be opened"
            echo
            echo "**Play has already accepted versionCode \`${{ needs.preflight.outputs.version_code }}\`.**"
            echo "It is consumed. Close the ledger by hand before the next release:"
            echo
            echo '1. add the entry to `android/release-ledger.json` and raise `highestConsumedVersionCode`;'
            echo '2. append the history line in `android/version.properties` and increment `androidBuild`;'
            echo '3. run `node scripts/release-candidate.mjs` to confirm the next candidate is legal.'
            echo
            echo "Until then the release workflow will still refuse a re-release: its Play probe reads"
            echo "the consumed codes from Play, not from this repository."
          } >> "$GITHUB_STEP_SUMMARY"
