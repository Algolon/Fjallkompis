name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scope cancellation to this workflow/ref. This prevents stale historical
  # `pages` group state from blocking a fresh main deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # ---- Terrain relief archives: canonical GitHub Release assets ---------
      #
      # Hillshade terrain-RGB + contour vectors (built by
      # scripts/build-terrain-map.sh from the Copernicus GLO-30 DEM). Same
      # model as the satellite archive: never committed, downloaded from the
      # pinned terrain-data release into the Pages build and served
      # same-origin. New data ⇒ new release tag ⇒ update TAG/SHA-256 pins.
      #
      # terrain-data-v3 (0.17.0 earlier contours, issue #33): contours
      # retiled so 100 m index lines exist from z9 tiles and the 20 m set
      # from z12 — required by the z9.5/z11.5 contour fade-ins. The terrain
      # archive is bit-identical to terrain-data-v2 (same SHA pin).
      - name: Fetch terrain relief archives from the pinned data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p public/maps
          gh release download terrain-data-v3 \
            --repo Algolon/Fjallkompis \
            --pattern 'kungsleden-terrain.pmtiles' \
            --pattern 'kungsleden-contours.pmtiles' \
            --dir public/maps
      - name: Verify terrain relief archive integrity
        run: |
          set -euo pipefail
          verify() {
            local f="$1" expected_sha="$2"
            local actual_sha
            actual_sha="$(sha256sum "$f" | awk '{print $1}')"
            echo "$f sha256: $actual_sha (expected $expected_sha)"
            [ "$actual_sha" = "$expected_sha" ] || { echo "FATAL: $f SHA-256 mismatch"; exit 1; }
          }
          verify public/maps/kungsleden-terrain.pmtiles "89eef71787ceb1f4b827b9eee1906fd799d89c4d4d587be31a4d944efb399aa5"
          verify public/maps/kungsleden-contours.pmtiles "3e8fbcfa6ee1ea8df9abaec641d836e11602867c09c83f77173e522826b7d573"

      # ---- Satellite archive: canonical GitHub Release asset ----------------
      #
      # The ~59 MB PMTiles binary is NOT committed. The canonical copy lives on
      # the satellite-data-v3 Release; deployment downloads it into the Pages
      # build so browsers fetch it SAME-ORIGIN (GitHub Release assets send no
      # CORS headers, so the app cannot fetch them cross-origin directly).
      # New imagery ⇒ new release tag ⇒ update TAG/SHA-256/size pins here.
      - name: Fetch satellite archive from the pinned data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p public/maps
          gh release download satellite-data-v3 \
            --repo Algolon/Fjallkompis \
            --pattern kungsleden-satellite.pmtiles \
            --dir public/maps
      - name: Verify satellite archive integrity
        run: |
          set -euo pipefail
          f=public/maps/kungsleden-satellite.pmtiles
          expected_sha="b94714526b48bc07220a851e4cc05684800e5d2967804b6907f72a922258c694"
          expected_size=61704169
          actual_sha="$(sha256sum "$f" | awk '{print $1}')"
          actual_size="$(stat -c '%s' "$f")"
          echo "sha256: $actual_sha (expected $expected_sha)"
          echo "size  : $actual_size (expected $expected_size)"
          [ "$actual_sha" = "$expected_sha" ] || { echo "FATAL: satellite archive SHA-256 mismatch"; exit 1; }
          [ "$actual_size" = "$expected_size" ] || { echo "FATAL: satellite archive size mismatch"; exit 1; }

      # The temporary map-comparison benchmark concluded with the 0.17.0
      # Nordic terrain iteration: the VITE_ENABLE_MAP_BENCHMARK variable and
      # the VITE_THUNDERFOREST_API_KEY secret are no longer read by the
      # build. The repository variable can be deleted and the Thunderforest
      # key rotated/removed in its dashboard.
      - run: npm run build

      # Google Play is given ONE public privacy-policy URL, served from this
      # deployment. If the page ever stopped shipping, the Play listing would
      # point at a 404 and nothing in the app would break to tell us.
      - name: Verify the public privacy policy made it into the build
        run: node scripts/verify-privacy-build.mjs

      - name: Verify terrain relief archives made it into the build
        run: |
          set -euo pipefail
          for f in dist/maps/kungsleden-terrain.pmtiles dist/maps/kungsleden-contours.pmtiles; do
            test -f "$f" || { echo "FATAL: $f missing from build output"; exit 1; }
          done
          echo "✓ terrain relief archives present in dist/maps"
      - name: Verify satellite archive made it into the build
        run: |
          set -euo pipefail
          f=dist/maps/kungsleden-satellite.pmtiles
          test -f "$f" || { echo "FATAL: $f missing from build output"; exit 1; }
          expected_sha="b94714526b48bc07220a851e4cc05684800e5d2967804b6907f72a922258c694"
          actual_sha="$(sha256sum "$f" | awk '{print $1}')"
          [ "$actual_sha" = "$expected_sha" ] || { echo "FATAL: built archive SHA-256 mismatch"; exit 1; }
          echo "✓ dist/maps/kungsleden-satellite.pmtiles present, sha256 verified"
      - id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages@v4 hard-caps its wait at 10 minutes and cancels
      # deployments that are still healthy but slow. Poll the same official
      # Pages API for up to 45 minutes without cancelling on a local timeout.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID)
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error(`Invalid Pages artifact id: ${process.env.ARTIFACT_ID}`)
            }

            const { owner, repo } = context.repo
            const oidcToken = await core.getIDToken()
            const created = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                owner,
                repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: oidcToken,
              },
            )

            const deploymentId =
              created.data.id ??
              created.data.status_url?.split('/').filter(Boolean).pop() ??
              context.sha
            const rawPageUrl =
              created.data.page_url ?? `https://${owner}.github.io/${repo}/`
            const pageUrl = /^https?:\/\//.test(rawPageUrl)
              ? rawPageUrl
              : `https://${rawPageUrl}`
            core.setOutput('page_url', pageUrl)
            core.info(`Created Pages deployment ${deploymentId} for ${context.sha}`)

            const failures = new Map([
              ['deployment_failed', 'Pages deployment failed'],
              ['deployment_perms_error', 'Pages deployment permissions failed'],
              ['deployment_content_failed', 'Pages rejected the artifact content'],
              ['deployment_cancelled', 'Pages deployment was cancelled'],
              ['deployment_lost', 'Pages deployment stopped reporting status'],
            ])
            const deadline = Date.now() + 45 * 60 * 1000
            let transientErrors = 0
            let lastStatus = ''

            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 5000))

              try {
                const response = await github.request(
                  'GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}',
                  { owner, repo, deploymentId },
                )
                transientErrors = 0
                const status = response.data.status

                if (status !== lastStatus) {
                  core.info(`Pages deployment status: ${status}`)
                  lastStatus = status
                }

                if (status === 'succeed') {
                  core.info(`Published ${pageUrl}`)
                  return
                }
                if (failures.has(status)) {
                  throw new Error(`${failures.get(status)} (${status})`)
                }
              } catch (error) {
                if (error.message?.includes('Pages deployment')) {
                  throw error
                }
                transientErrors += 1
                core.warning(
                  `Status check ${transientErrors} failed: ${error.message}`,
                )
                if (transientErrors >= 20) {
                  throw new Error('Too many consecutive Pages status errors')
                }
              }
            }

            // Do not cancel a healthy backend deployment merely because the
            // workflow-side wait expired.
            throw new Error(
              `Pages deployment ${deploymentId} did not finish within 45 minutes`,
            )
