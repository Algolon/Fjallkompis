name: Android spike APK

# Builds the Capacitor Android wrapper and publishes a DEBUG APK as a
# workflow artifact, so the wrapper can be installed on a physical phone
# without anyone needing Android Studio.
#
# THIS WORKFLOW NEVER TOUCHES PRODUCTION. It has no `pages` permission, no
# `id-token`, and no deployment step; it cannot publish to GitHub Pages and it
# cannot publish to Google Play. The only credential involved is the standard
# Android debug keystore, which Gradle generates on the runner and which is
# worthless outside a developer install — no release signing material is
# referenced, stored or required.
#
# It is also deliberately NOT wired into every pull request: unrelated PRs
# should not pay for a Gradle build. It runs on pushes to the spike branch
# (which includes every update to the spike PR) and on demand.

on:
  push:
    branches: [agent/android-capacitor-spike]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A group of its own. Sharing the Pages group would let an APK build cancel
  # a production deployment, or be cancelled by one.
  group: android-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Test, build and assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same Node major as pr-ci.yml and deploy.yml — the wrapper must be
          # built by the toolchain the rest of the project is validated on.
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # ---- Regression gates: the shared application must still be sound -----
      #
      # These are the same three checks pr-ci.yml runs, in the same order, and
      # they run BEFORE anything Android-specific. If the wrapper has broken
      # the web app, this job fails here rather than shipping a green APK
      # built from a broken tree.
      - name: Test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Web build (GitHub Pages target — regression gate only, never deployed)
        run: npm run build

      # ---- The native target ------------------------------------------------
      #
      # This overwrites dist/ with the WebView build (root base, no service
      # worker). verify-native-build.mjs then proves that on the real output —
      # it is what stops a stale Pages build being packaged into the APK.
      - name: Native build
        run: npm run build:native

      - name: Verify the native web bundle
        run: npm run verify:native

      # Both targets carry the privacy page (it is unbundled public/ content),
      # and the in-app Settings link points at the SAME canonical public URL on
      # both. Running the verifier here as well is what stops the two targets
      # diverging into "the PWA has a policy and the APK does not".
      - name: Verify the privacy policy in the native bundle
        run: node scripts/verify-privacy-build.mjs

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure the compile SDK and build tools are installed
        # The runner image ships the Android SDK with its licences already
        # accepted, so this is a no-op when the packages are present and a
        # non-interactive install when they are not.
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle assembleDebug
        # Debug signing config only — Gradle uses the standard auto-generated
        # ~/.android/debug.keystore. No secrets are read and none are needed.
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify the packaged vector basemap
        # verify:native proves the archive is in dist/; this proves it is in
        # the artifact a device actually installs, byte-identical to the
        # committed file. The Map tab reads the PACKAGED copy as one complete
        # blob in the native shell (src/map/bundledArchive.mjs), so an APK
        # without it — or with a stale or truncated copy — has no offline
        # basemap, silently, on every fresh install.
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          entry=assets/public/maps/kungsleden.pmtiles
          if ! unzip -l "$apk" "$entry" > /dev/null; then
            echo "::error::$entry is missing from the APK — the Map tab would have no offline basemap"
            exit 1
          fi
          packaged_sha="$(unzip -p "$apk" "$entry" | sha256sum | cut -d' ' -f1)"
          source_sha="$(sha256sum public/maps/kungsleden.pmtiles | cut -d' ' -f1)"
          if [ "$packaged_sha" != "$source_sha" ]; then
            echo "::error::packaged basemap ($packaged_sha) differs from public/maps/kungsleden.pmtiles ($source_sha)"
            exit 1
          fi
          echo "Packaged vector basemap verified (sha256 $packaged_sha)."

      - name: Verify the optional map archives are NOT in the APK
        # Mirror image of the check above: terrain, contours and satellite are
        # user-initiated downloads on both platforms, and they reach dist only
        # by accident (public/maps/ on a machine that ran the deploy fetch).
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          for f in kungsleden-terrain.pmtiles kungsleden-contours.pmtiles kungsleden-satellite.pmtiles; do
            if unzip -l "$apk" "assets/public/maps/$f" > /dev/null 2>&1; then
              echo "::error::$f is an optional download and must not be packaged in the APK"
              exit 1
            fi
          done
          echo "Optional map archives correctly absent from the APK."

      - name: Name the APK and record its size
        id: apk
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          src=android/app/build/outputs/apk/debug/app-debug.apk
          out="fjallkompis-${version}-android-spike-debug.apk"
          mkdir -p artifact
          cp "$src" "artifact/${out}"
          size="$(du -h "artifact/${out}" | cut -f1)"
          echo "name=${out}" >> "$GITHUB_OUTPUT"
          {
            echo "### Android spike APK"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`${out}\` |"
            echo "| Size | ${size} |"
            echo "| Application id | \`com.algolon.fjallkompis\` (provisional) |"
            echo "| Signing | debug keystore — **not** for distribution |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          # Referenced by name in the spike PR description and the final
          # report; do not rename without updating both.
          name: fjallkompis-android-spike-debug
          # Only the APK. No mapping files, no intermediates, no web build.
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 30
