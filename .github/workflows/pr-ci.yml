name: Pull request CI

on:
  pull_request:
    # Slice PRs for a multi-PR milestone target its integration branch
    # (docs/DEVELOPMENT.md → "Release integration branches") and must pass
    # the same gate as PRs against main. Deploy stays main-only.
    branches: [main, 'v*-integration']

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # `npm test` checks the branding SOURCE tree; this checks what the build
      # actually emitted. vite-plugin-pwa rewrites the manifest between the
      # two — a build that emits icon URLs outside the Pages subpath passes
      # every source-level test and still installs with a blank icon.
      - name: Verify the built PWA branding
        run: node scripts/verify-brand-build.mjs
