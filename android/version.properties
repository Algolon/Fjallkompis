# Android build counter — the ONLY number a developer edits by hand.
#
# The app's version comes from package.json (currently the source of truth for
# versionName). This counter distinguishes multiple Android uploads of the SAME
# app version, which Play requires: every upload needs a versionCode strictly
# higher than the last, even a re-upload that fixes only wrapper plumbing.
#
# HOW TO INCREMENT — exactly two cases:
#
#   * Same app version, new Play upload  -> increase androidBuild by 1.
#   * package.json version went up        -> reset androidBuild to 1.
#
# Never decrease either number, and never reuse a versionCode Play has already
# accepted — Play rejects the upload, and a code that has been live cannot be
# reclaimed. When in doubt, increment androidBuild; a skipped code costs
# nothing.
#
# android/app/build.gradle combines the two into the final versionCode and
# refuses to build if the result is not a positive, in-range integer. See
# "Versioning" in docs/ANDROID.md.
